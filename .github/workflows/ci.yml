name: CI

# One workflow, so a change is tested exactly once per event.
#
# A pull request is verified by the `pull_request` trigger alone — pushing to a
# branch does not start a second identical run. `main` is only ever written by a
# squash merge, and that push is what tests the merged result and, if the version
# moved, ships it.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Superseding a pull request cancels its earlier run. A push to `main` is never
# cancelled: it may be midway through publishing a release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: build & test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        # The suite never contacts the real worker CLI; every task-level test
        # drives a mock so CI needs no Antigravity install or credentials.
        run: npm test

      # The real installer check runs after a release exists, which is too late
      # to stop a broken script from being published. A syntax check is not,
      # and it is the one class of breakage that costs nothing to catch here.
      - name: Parse the shell scripts
        run: bash -n install.sh scripts/verify-install.sh

      - name: Fail if the suite left git worktrees behind
        run: |
          count=$(git worktree list | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "Test run leaked $((count - 1)) git worktree(s):"
            git worktree list
            exit 1
          fi

      - name: Check the published package stays small
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const [pkg] = require('./pack.json');
            const mb = pkg.size / 1024 / 1024;
            console.log(\`package: \${pkg.entryCount} files, \${mb.toFixed(2)} MB\`);
            if (mb > 2) { console.error('Package exceeds 2 MB'); process.exit(1); }
          "

  # Cheap gate so the expensive release job only starts when there is something
  # to release. The version in package.json is the trigger: merge a version bump
  # and the release happens, merge anything else and it does not.
  release-gate:
    name: release gate
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether this commit releases
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")

          # Fail loudly on a malformed version rather than tagging something
          # unusable. This also keeps the value safe to write to $GITHUB_OUTPUT,
          # which is line-oriented.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "package.json version '${VERSION}' is not a plain semver string." >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if git rev-parse "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "v${VERSION} is already tagged — nothing to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "package.json is at ${VERSION} and v${VERSION} is not tagged — releasing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: release
    needs: release-gate
    if: needs.release-gate.outputs.publish == 'true'
    # macOS, not Linux, and the whole job rather than a split build. pkg
    # ad-hoc signs its darwin output only when it can run `codesign`, which
    # exists on a macOS runner and not on ubuntu. Built on Linux, the darwin
    # binaries ship unsigned, and macOS kills unsigned arm64 executables on
    # sight — v0.1.0 and v0.1.1 both exit 137 on Apple Silicon. Signing them
    # afterwards is not an option either: the signature is appended to the
    # Mach-O and corrupts pkg's appended snapshot. pkg cross-builds the linux
    # and windows targets from here just as it did the other way round, and
    # standard runners are free for public repositories, so a single job stays
    # simplest — no artifact hand-off between runners.
    runs-on: macos-latest
    permissions:
      contents: write # create the tag and the GitHub release
      id-token: write # mint the OIDC token npm trusted publishing needs
    env:
      VERSION: ${{ needs.release-gate.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # Never cache in a release build: the published artifact must come
          # from a resolution this job performed itself.
          package-manager-cache: false

      - name: Use an npm that speaks trusted publishing
        run: npm install -g npm@latest

      - run: npm ci

      # The suite is deliberately not re-run here. This job only starts once
      # `test` is green on this exact commit across Node 18, 20 and 22, so a
      # fourth run would cost minutes and prove nothing new.
      - name: Build
        run: npm run build

      - name: Publish to npm
        # No NPM_TOKEN: authentication is the OIDC token minted above, which npm
        # accepts because this repository and workflow are registered as a
        # trusted publisher for the package. Provenance is attached from the
        # same identity.
        run: npm publish --provenance --access public

      - name: Build standalone binaries
        run: npm run build:binaries

      # The runner is Apple Silicon, so the arm64 binary can simply be run.
      # This is the check that would have caught both binary defects shipped so
      # far: an unsigned binary dies with SIGKILL here, and one built without
      # the version injected reports the wrong number.
      - name: Verify the macOS binary is signed and runs
        run: |
          codesign -dv dist/binaries/gelada-darwin-arm64
          codesign -dv dist/binaries/gelada-darwin-x64

          ACTUAL=$(./dist/binaries/gelada-darwin-arm64 --version)
          echo "binary reports: ${ACTUAL}"
          if [ "$ACTUAL" != "$VERSION" ]; then
            echo "binary reports '${ACTUAL}' but this release is '${VERSION}'" >&2
            exit 1
          fi

      - name: Package archives and compute checksums
        run: |
          mkdir -p release-assets
          TAG="v${VERSION}"

          tar -czvf "release-assets/gelada-${TAG}-darwin-x64.tar.gz"   -C dist/binaries gelada-darwin-x64
          tar -czvf "release-assets/gelada-${TAG}-darwin-arm64.tar.gz" -C dist/binaries gelada-darwin-arm64
          tar -czvf "release-assets/gelada-${TAG}-linux-x64.tar.gz"    -C dist/binaries gelada-linux-x64
          tar -czvf "release-assets/gelada-${TAG}-linux-arm64.tar.gz"  -C dist/binaries gelada-linux-arm64
          (cd dist/binaries && zip "../../release-assets/gelada-${TAG}-win-x64.zip" gelada-win-x64.exe)

          cd release-assets
          # shasum, not sha256sum: the runner is macOS now.
          shasum -a 256 gelada-${TAG}-* > checksums.txt
          cat checksums.txt

      - name: Create the tag and the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release-assets/*
            install.sh

      # The one thing every step above proves is that the artifacts are correct.
      # None of them proves a user can get one. install.sh asked for an archive
      # name no release has ever had, from 0.1.0 to 0.1.3, and nothing noticed
      # because nothing ran it. So run it — against the release just published,
      # the way a user would, and refuse to call this release good until a
      # downloaded binary reports its own version back.
      - name: Verify install.sh delivers this release (macOS)
        run: bash scripts/verify-install.sh "$VERSION"

  # The same check on Linux, which the release job cannot do from a macOS runner.
  # It is the platform with the least coverage otherwise: the linux binaries are
  # cross-built by pkg and never executed anywhere else in this workflow, so this
  # is the only step that proves one of them starts at all.
  verify-install-linux:
    name: verify install.sh (linux)
    needs: [release-gate, release]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release-gate.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify install.sh delivers this release (linux)
        run: bash scripts/verify-install.sh "$VERSION"
