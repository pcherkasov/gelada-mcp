name: CI/CD Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

  build-release-artifacts:
    name: build-release-artifacts
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Standalone Binaries
        run: npm run build:binaries

      - name: Package Archives and Compute Checksums
        run: |
          # Determine release tag version
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ] || [ "$TAG" = "master" ]; then
            TAG="v0.1.0"
          fi
          echo "Packaging release archives for tag: ${TAG}"

          mkdir -p release-assets

          # Package executables into release archives
          tar -czvf "release-assets/gelada-${TAG}-darwin-x64.tar.gz" -C dist/binaries gelada-darwin-x64
          tar -czvf "release-assets/gelada-${TAG}-darwin-arm64.tar.gz" -C dist/binaries gelada-darwin-arm64
          tar -czvf "release-assets/gelada-${TAG}-linux-x64.tar.gz" -C dist/binaries gelada-linux-x64
          tar -czvf "release-assets/gelada-${TAG}-linux-arm64.tar.gz" -C dist/binaries gelada-linux-arm64
          (cd dist/binaries && zip "../../release-assets/gelada-${TAG}-win-x64.zip" gelada-win-x64.exe)

          # Compute SHA256 checksums file
          cd release-assets
          sha256sum gelada-${TAG}-* > checksums.txt
          cat checksums.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: release-assets/*
          retention-days: 7

  publish-release:
    name: publish-release
    runs-on: ubuntu-latest
    needs: build-release-artifacts
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            release-assets/*
            install.sh
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
